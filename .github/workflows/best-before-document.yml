name: Document Expiration Check

on:
  push:
    branches: [ $default-branch, 'best-before' ]
  pull_request:
    branches: [ $default-branch ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Check markdown docs expiration
        run: pwd && node ./best-before-document-github-action/index.js